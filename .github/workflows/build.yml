name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Link Command Line Tools for Build Script
        run: |
          ln -s $ANDROID_HOME/cmdline-tools/latest ./cmdline-tools

      - name: Fix Android Home in Build Script
        run: |
          sed -i 's|export ANDROID_HOME=.*|export ANDROID_HOME=/usr/local/lib/android/sdk|g' make.sh

      - name: Create Custom Configuration File
        run: |
          mkdir -p confs
          cat << 'EOF' > confs/kdramatagalogverse.conf
          id = TagalogVerse
          name = TagalogVerse
          mainURL = https://kdramatagalogverse.blogspot.com/
          EOF

      - name: Run Build Script
        run: |
          chmod +x make.sh
          ./make.sh keygen
          ./make.sh build confs/kdramatagalogverse.conf

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: TagalogVerse-APK
          path: output/*.apk